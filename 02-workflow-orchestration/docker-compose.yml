# Docker Compose file to set up Kestra with PostgreSQL database and PgAdmin
# This configuration includes two PostgreSQL databases: one for Kestra and another for the taxi dataset. 
# PgAdmin is included to manage both databases.

# Volumes for persisting data
volumes:
  kestra-db-volume: 
  kestra-storage:
  taxi-db-volume:
  pgadmin:
  # Volume for running SQL init scripts for the taxi datasets
  taxi-init:

services:
  # Kestra PostgreSQL database configuration
  postgres_kestra_db:
    image: postgres:18.0-alpine
    container_name: postgres-kestra-db
    env_file:
      - .env
    environment: 
      POSTGRES_DB: ${KESTRA_DATABASE_NAME}
      POSTGRES_USER: ${KESTRA_USER}
      POSTGRES_PASSWORD: ${KESTRA_PASSWORD}
    volumes:
      - kestra-db-volume:/var/lib/postgresql/data
    ports:
      # Host port 5433 mapped to container port 5432 to avoid conflict with taxi DB 
      - "5433:5432"
    healthcheck:
      test: [
        "CMD-SHELL", 
        "pg_isready -U ${KESTRA_USER} -d ${KESTRA_DATABASE_NAME}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

# Kestra server container configuration
  kestra:
    image: kestra/kestra:latest
    container_name: kestra-server
    user: "${KESTRA_DOCKER_USER}"
    command: server standalone
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - kestra-storage:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock
      - ./tmp:/tmp/kestra-wd
    env_file:
      - .env
    environment:
      KESTRA_DATABASE_URL: ${KESTRA_DATABASE_URL} # Internal network connection
      KESTRA_USER: ${KESTRA_USER}
      KESTRA_PASSWORD: ${KESTRA_PASSWORD}
      KESTRA_AUTH_USER: ${KESTRA_AUTH_USER}
      KESTRA_AUTH_PASSWORD: ${KESTRA_AUTH_PASSWORD}
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: ${KESTRA_DATABASE_URL}
            driverClassName: org.postgresql.Driver
            username: ${KESTRA_USER}
            password: ${KESTRA_PASSWORD}
        kestra:
          server:
            basicAuth:
              enabled: true
              username: "${KESTRA_AUTH_USER}"
              password: ${KESTRA_AUTH_PASSWORD}
        repository:
          type: postgres
        storage:
          type: local
          local:
            basePath: "/app/storage"
        queue:
          type: postgres
        task:
          tmpDir:
            path: /tmp/kestra-wd/tmp
        url: http://localhost:8080
    depends_on:
      postgres_kestra_db:
        condition: service_healthy

# Taxi database    
  postgres_taxi_db:
    image: postgres:18.0-alpine
    container_name: postgres-taxi-db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${TAXI_DATABASE_NAME}
      POSTGRES_USER: ${TAXI_DB_USER}
      POSTGRES_PASSWORD: ${TAXI_DB_PASSWORD}
    volumes:
      - taxi-db-volume:/var/lib/postgresql/data
      - ./taxi-init:/docker-entrypoint-initdb.d
    ports:
      - "5434:5432"
    healthcheck:
      test: [
        "CMD-SHELL", 
        "pg_isready -U ${TAXI_DB_USER} -d ${TAXI_DATABASE_NAME}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

# PgAdmin to manage both databases
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "8085:80"
    volumes:
      - pgadmin:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json
    depends_on:
      postgres_kestra_db:
        condition: service_healthy
      postgres_taxi_db: 
        condition: service_healthy

